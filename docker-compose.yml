services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dalili-backend:latest
    container_name: dalili-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8181}:8181"
    environment:
      PORT: 8181
      DALILI_STORAGE_DIR: /home/spring/.dalili
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dalili}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      DALILI_JWT_SECRET: ${DALILI_JWT_SECRET:-replace-with-a-long-random-secret}
      DALILI_SECURITY_ALLOWED_ORIGINS: ${DALILI_SECURITY_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: dalili-db
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dalili}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dalili}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
