server:
  port: 8181
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/dalili
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
dalili:
  clinic:
    name: Dalili Health Clinic
  jwt:
    secret: your-256-bit-secret-key-for-jwt-signing-min-32-chars
    staff-expiration-hours: 12
    patient-expiration-hours: 24
    kiosk-expiration-minutes: 10
  kiosk:
    auto-provision-default: true
    default-device-id: kiosk-front-desk-1
    default-device-secret: kiosk-secret-change-me
    default-location-description: Front Desk 1
  ai:
    transcription-model: whisper-large-v3-turbo
  security:
    allowed-origins: http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*
  session:
    patient-inactivity-seconds: 300   # 5 minutes
    staff-inactivity-seconds: 1800    # 30 minutes
  audit:
    skip-verification: true  # Set to false to enforce verification (this is temporary for fixing the ledger)
