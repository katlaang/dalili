spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/dalili
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
dalili:
  clinic:
    name: Dalili Health Clinic
  jwt:
    secret: your-256-bit-secret-key-for-jwt-signing-min-32-chars
    staff-expiration-hours: 12
    patient-expiration-hours: 24
    kiosk-expiration-minutes: 10
  ai:
    transcription-model: whisper-large-v3-turbo
  security:
    allowed-origins: http://localhost:19006,http://localhost:8081,http://localhost:3000
  session:
    patient-inactivity-seconds: 300   # 5 minutes
    staff-inactivity-seconds: 1800    # 30 minutes
