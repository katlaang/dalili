# Kenya Triage Policy Package
# Version: KE-TRIAGE-2026.01
# Effective: January 2026
# Target: Pilot clinics in Kenya
#
# This policy is synced to facilities and executed locally.
# All triage decisions log this version for legal defensibility.

version: "KE-TRIAGE-2026.01"
country: "KE"
country_name: "Kenya"
effective_date: "2026-01-01"
expires_date: "2027-01-01"
description: "Kenya pilot triage policy with emphasis on malaria, dehydration, and infectious disease"

# =============================================================================
# VITAL SIGN THRESHOLDS
# =============================================================================
vital_thresholds:
  adult: # Age >= 14
    emergency:
      systolic_bp_below: 90
      diastolic_bp_above: 120
      oxygen_saturation_below: 92
      heart_rate_above: 130
      heart_rate_below: 40
      temperature_above: 40.0
      temperature_below: 35.0
      respiratory_rate_above: 30
      respiratory_rate_below: 8
      gcs_below: 9
    urgent:
      systolic_bp_below: 100
      systolic_bp_above: 180
      diastolic_bp_above: 110
      oxygen_saturation_below: 95
      heart_rate_above: 120
      heart_rate_below: 50
      temperature_above: 39.5
      temperature_below: 35.5
      respiratory_rate_above: 24
      respiratory_rate_below: 10
      gcs_below: 13
    standard:
      systolic_bp_above: 140
      diastolic_bp_above: 90
      heart_rate_above: 100
      temperature_above: 38.5
      respiratory_rate_above: 20

  pediatric: # Age 1-13
    emergency:
      oxygen_saturation_below: 90
      heart_rate_above: 180
      heart_rate_below: 60
      temperature_above: 40.5
      temperature_below: 35.0
      respiratory_rate_above: 60
      respiratory_rate_below: 10
    urgent:
      oxygen_saturation_below: 94
      heart_rate_above: 160
      temperature_above: 39.5
      respiratory_rate_above: 50

  infant: # Age < 1
    emergency:
      oxygen_saturation_below: 90
      heart_rate_above: 200
      heart_rate_below: 80
      temperature_above: 40.0
      temperature_below: 36.0
      respiratory_rate_above: 70
    urgent:
      oxygen_saturation_below: 94
      heart_rate_above: 180
      temperature_above: 39.0
      respiratory_rate_above: 60

# =============================================================================
# RED FLAG PHRASES
# =============================================================================
red_flag_phrases:
  critical:
    - phrase: "worst headache"
      category: "NEUROLOGICAL"
      suggests: [ "Subarachnoid hemorrhage", "Meningitis" ]
    - phrase: "crushing chest pain"
      category: "CARDIOVASCULAR"
      suggests: [ "MI", "Aortic dissection" ]
    - phrase: "tearing chest pain"
      category: "CARDIOVASCULAR"
      suggests: [ "Aortic dissection" ]
    - phrase: "chest pain radiating to arm"
      category: "CARDIOVASCULAR"
      suggests: [ "MI" ]
    - phrase: "can't breathe"
      category: "RESPIRATORY"
      suggests: [ "Respiratory failure", "Anaphylaxis", "PE" ]
    - phrase: "difficulty breathing"
      category: "RESPIRATORY"
      suggests: [ "Respiratory distress", "Asthma", "PE" ]
    - phrase: "sudden weakness"
      category: "NEUROLOGICAL"
      suggests: [ "Stroke", "TIA" ]
    - phrase: "face drooping"
      category: "NEUROLOGICAL"
      suggests: [ "Stroke" ]
    - phrase: "slurred speech"
      category: "NEUROLOGICAL"
      suggests: [ "Stroke", "Hypoglycemia" ]
    - phrase: "seizure"
      category: "NEUROLOGICAL"
      suggests: [ "Seizure disorder", "Eclampsia", "Meningitis" ]
    - phrase: "unconscious"
      category: "NEUROLOGICAL"
      suggests: [ "Syncope", "Stroke", "Hypoglycemia", "Overdose" ]
    - phrase: "vomiting blood"
      category: "GI_HEMORRHAGE"
      suggests: [ "Upper GI bleed", "Peptic ulcer" ]
    - phrase: "coughing blood"
      category: "RESPIRATORY"
      suggests: [ "TB", "PE", "Lung cancer" ]
    - phrase: "heavy vaginal bleeding"
      category: "OBSTETRIC"
      suggests: [ "Miscarriage", "Placenta previa", "Ectopic" ]

  high:
    - phrase: "severe abdominal pain"
      category: "ABDOMINAL"
      suggests: [ "Appendicitis", "Ectopic pregnancy", "Bowel obstruction" ]
    - phrase: "severe headache"
      category: "NEUROLOGICAL"
      suggests: [ "Migraine", "Meningitis", "Hypertensive crisis" ]
    - phrase: "high fever"
      category: "INFECTIOUS"
      suggests: [ "Malaria", "Sepsis", "Meningitis" ]
    - phrase: "confusion"
      category: "NEUROLOGICAL"
      suggests: [ "Delirium", "Hypoglycemia", "Sepsis", "Cerebral malaria" ]
    - phrase: "yellow eyes"
      category: "HEPATIC"
      suggests: [ "Malaria", "Hepatitis", "Yellow fever" ]
    - phrase: "dark urine"
      category: "RENAL"
      suggests: [ "Dehydration", "Malaria", "Hepatitis" ]
    - phrase: "not urinating"
      category: "RENAL"
      suggests: [ "Dehydration", "Renal failure" ]
    - phrase: "bloody diarrhea"
      category: "GI_INFECTIOUS"
      suggests: [ "Dysentery", "Cholera" ]
    - phrase: "child not drinking"
      category: "PEDIATRIC"
      suggests: [ "Dehydration", "Sepsis" ]
    - phrase: "sunken fontanelle"
      category: "PEDIATRIC"
      suggests: [ "Severe dehydration" ]

  moderate:
    - phrase: "persistent vomiting"
      category: "GI"
      suggests: [ "Gastroenteritis", "Obstruction", "Pregnancy" ]
    - phrase: "pain when urinating"
      category: "UROLOGICAL"
      suggests: [ "UTI", "STI" ]
    - phrase: "swollen leg"
      category: "VASCULAR"
      suggests: [ "DVT", "Cellulitis" ]
    - phrase: "rash with fever"
      category: "INFECTIOUS"
      suggests: [ "Viral exanthem", "Meningococcemia", "Dengue" ]

# =============================================================================
# SYMPTOM CLUSTERS
# =============================================================================
symptom_clusters:
  - id: "cardiac_mi"
    symptoms: [ "chest pain", "shortness of breath", "diaphoresis" ]
    minimum_match: 2
    suggests:
      - code: "I21.9"
        name: "Acute myocardial infarction"
        rule_out: true
        confidence: 0.7
      - code: "I26.9"
        name: "Pulmonary embolism"
        rule_out: true
        confidence: 0.5
    urgency: EMERGENCY
    protocol: "chest_pain"

  - id: "meningitis"
    symptoms: [ "fever", "stiff neck", "headache", "photophobia" ]
    minimum_match: 3
    suggests:
      - code: "G03.9"
        name: "Meningitis"
        rule_out: true
        confidence: 0.8
    urgency: EMERGENCY
    protocol: "meningitis"

  - id: "severe_malaria"
    symptoms: [ "fever", "confusion", "jaundice", "dark urine" ]
    minimum_match: 2
    suggests:
      - code: "B50.0"
        name: "Severe malaria (P. falciparum)"
        rule_out: false
        confidence: 0.8
    urgency: EMERGENCY
    protocol: "severe_malaria"
    tests: [ "Malaria RDT", "Blood smear", "Blood glucose" ]

  - id: "uncomplicated_malaria"
    symptoms: [ "fever", "chills", "headache", "body aches" ]
    minimum_match: 3
    suggests:
      - code: "B50.9"
        name: "Malaria, unspecified"
        rule_out: false
        confidence: 0.7
    urgency: URGENT
    tests: [ "Malaria RDT", "Blood smear" ]

  - id: "cholera_like"
    symptoms: [ "profuse watery diarrhea", "vomiting", "dehydration" ]
    minimum_match: 2
    suggests:
      - code: "A00.9"
        name: "Cholera"
        rule_out: true
        confidence: 0.6
    urgency: EMERGENCY
    protocol: "cholera"

  - id: "severe_dehydration_child"
    symptoms: [ "diarrhea", "vomiting", "sunken eyes", "lethargy" ]
    minimum_match: 3
    age_group: "pediatric"
    suggests:
      - code: "E86.0"
        name: "Severe dehydration"
        rule_out: false
        confidence: 0.9
    urgency: EMERGENCY
    protocol: "pediatric_dehydration"

  - id: "ectopic_pregnancy"
    symptoms: [ "abdominal pain", "vaginal bleeding", "missed period", "dizziness" ]
    minimum_match: 3
    sex: "F"
    suggests:
      - code: "O00.9"
        name: "Ectopic pregnancy"
        rule_out: true
        confidence: 0.7
    urgency: EMERGENCY
    protocol: "ectopic"

# =============================================================================
# EMERGENCY PROTOCOLS
# =============================================================================
protocols:
  chest_pain:
    name: "Chest Pain Protocol"
    urgency: EMERGENCY
    time_critical: true
    steps:
      - id: "cp_1"
        action: "Obtain 12-lead ECG"
        time_limit_minutes: 10
        required: true
      - id: "cp_2"
        action: "Check blood pressure both arms"
        required: true
      - id: "cp_3"
        action: "Obtain SpO2"
        required: true
      - id: "cp_4"
        action: "Apply oxygen if SpO2 < 94%"
        conditional: true
      - id: "cp_5"
        action: "Aspirin 300mg (if no contraindication)"
        required: true
        contraindications: [ "aspirin allergy", "active bleeding" ]
      - id: "cp_6"
        action: "Establish IV access"
        required: true
      - id: "cp_7"
        action: "Notify physician immediately"
        required: true

  severe_malaria:
    name: "Severe Malaria Protocol"
    urgency: EMERGENCY
    region_specific: true
    steps:
      - id: "mal_1"
        action: "Malaria RDT or blood smear"
        required: true
      - id: "mal_2"
        action: "Check blood glucose"
        required: true
      - id: "mal_3"
        action: "Establish IV access"
        required: true
      - id: "mal_4"
        action: "IV Artesunate (weight-based dosing)"
        required: true
      - id: "mal_5"
        action: "IV fluids for dehydration"
        required: true
      - id: "mal_6"
        action: "Check hemoglobin/hematocrit"
        required: true
      - id: "mal_7"
        action: "Monitor urine output"
        required: true
      - id: "mal_8"
        action: "Notify physician"
        required: true

  cholera:
    name: "Cholera/Severe Diarrhea Protocol"
    urgency: EMERGENCY
    region_specific: true
    steps:
      - id: "chol_1"
        action: "Assess dehydration status (WHO scale)"
        required: true
      - id: "chol_2"
        action: "Weigh patient"
        required: true
      - id: "chol_3"
        action: "Start IV Ringer's Lactate (100ml/kg in first 3 hours)"
        required: true
      - id: "chol_4"
        action: "Begin ORS as soon as patient can drink"
        required: true
      - id: "chol_5"
        action: "Stool sample for culture"
        required: true
      - id: "chol_6"
        action: "Isolate patient"
        required: true
      - id: "chol_7"
        action: "Notify public health"
        required: true

  pediatric_dehydration:
    name: "Pediatric Severe Dehydration Protocol"
    urgency: EMERGENCY
    age_group: "pediatric"
    steps:
      - id: "ped_1"
        action: "Weigh child"
        required: true
      - id: "ped_2"
        action: "Assess dehydration using WHO IMCI criteria"
        required: true
      - id: "ped_3"
        action: "Check blood glucose"
        required: true
      - id: "ped_4"
        action: "IV or IO access"
        required: true
      - id: "ped_5"
        action: "IV Ringer's Lactate 20ml/kg bolus"
        required: true
      - id: "ped_6"
        action: "Reassess after bolus"
        required: true
      - id: "ped_7"
        action: "Notify physician"
        required: true

  meningitis:
    name: "Meningitis Protocol"
    urgency: EMERGENCY
    steps:
      - id: "men_1"
        action: "Isolate patient"
        required: true
      - id: "men_2"
        action: "Establish IV access"
        required: true
      - id: "men_3"
        action: "Blood cultures before antibiotics if possible"
        required: true
      - id: "men_4"
        action: "Empiric antibiotics within 1 hour"
        time_limit_minutes: 60
        required: true
      - id: "men_5"
        action: "Check blood glucose"
        required: true
      - id: "men_6"
        action: "Notify physician immediately"
        required: true

  ectopic:
    name: "Suspected Ectopic Pregnancy Protocol"
    urgency: EMERGENCY
    steps:
      - id: "ect_1"
        action: "Check blood pressure and heart rate"
        required: true
      - id: "ect_2"
        action: "Establish large-bore IV access x2"
        required: true
      - id: "ect_3"
        action: "Type and crossmatch"
        required: true
      - id: "ect_4"
        action: "Urine pregnancy test if not confirmed"
        required: true
      - id: "ect_5"
        action: "NPO (nothing by mouth)"
        required: true
      - id: "ect_6"
        action: "Notify surgeon/gynecologist immediately"
        required: true

# =============================================================================
# ESCALATION SCORING
# =============================================================================
escalation_scoring:
  points:
    critical_vital: 3
    high_risk_symptom: 2
    moderate_concern: 1
    critical_phrase: 3
    high_phrase: 2
    symptom_cluster_emergency: 3
    symptom_cluster_urgent: 2
  
  thresholds:
    level_1_min: 1
    level_1_max: 2
    level_2_min: 3
    level_2_max: 4
    level_3_min: 5

# =============================================================================
# SUGGESTED TESTS BY PRESENTATION
# =============================================================================
suggested_tests:
  fever_workup:
    - "Malaria RDT"
    - "CBC"
    - "Blood smear"
    - "Urinalysis"
  
  respiratory:
    - "SpO2"
    - "Chest X-ray"
    - "Sputum AFB (if cough > 2 weeks)"
  
  diarrhea:
    - "Stool microscopy"
    - "Stool culture"
    - "Electrolytes"

